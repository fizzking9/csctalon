# 客服中心管理系统 - 局域网部署 Docker Compose
# 使用: docker compose up -d --build
# 访问: http://<服务器IP>:80 (前端), http://<服务器IP>:8000 (后端API,可选)
#
# ⚠️ 发布纯净性(2026-08-30 部署审计): 部署脚本 upgrade.sh 支持 tar 包 与 --git 两种来源,
#    --git 模式 clone 后会清理 .trae/.dsh/.gitea/.workbuddy/docs/scripts 等开发杂质;
#    package.sh tar 模式同样排除(清单一致)。请勿在 git 里新增"随发布走"的开发/AI 工具目录,
#    否则会作为杂质进入 current 并进后端镜像。
#
# ⚠️ 固定 project name = csctalon:
#   部署脚本在 /opt/csctalon/current(软链, 指向 releases/<版本>)下运行 compose,
#   若不加 name, project name 默认取目录名 → 每次切版本(目录名=版本号)都会变,
#   导致容器/卷归属不同 project, 重装/升级时报 "container name already in use" 冲突、
#   或产生 920f48e_* 这种随版本漂移的残留卷。
#   固定 name 后, 无论从哪个目录跑 compose, 都用同一 project, 容器/卷/网络稳定复用。
name: csctalon
#
# 配置: 所有密钥/环境变量从同目录 .env 读取（已 gitignore），勿提交真实 .env。
# 数据: PG / Redis 数据 bind mount 到 ./data，宿主机可直接备份。
# 日志: ① 所有容器 stdout 走 json-file 轮转（单文件 10m，保留 3 份），防止撑爆磁盘；
#       ② 后端 gunicorn access/error 日志 + nginx 日志额外写文件到 ./logs，便于直接查看。
#
# 挂载路径变量化(生产部署用): 服务器上通过 .env 把数据/日志/附件指到固定绝对目录
# (如 /opt/csctalon/data), 这样代码目录可随版本切换(releases/current), 数据不随代码变动。
# 本地不设置这些变量时, 回退到默认相对路径 ./data 等, 行为与之前完全一致。
# ENV_FILE: 生产把 .env 放到代码目录外(如 /opt/csctalon/.env)时, 用它指过去(供容器 env_file 用);
#           本地不设置则默认用 compose 同目录的 .env。

services:
  db:
    image: postgres:15
    container_name: csctalon-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csctalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      # ★ 默认值走安全侧（#214 / AGENTS 铁律：库名默认不得指向真实库）：未显式注入时
      #   兜底 csctalon_dev，绝不默认真实库名 csctalon。db 容器仅在 data volume 首次初始化时
      #   据此建库；生产按 deploy/env.production.example 显式 POSTGRES_DB=csctalon + APP_MODE=prod
      #   （backend 启动期硬校验「模式↔库名」一致），故生产不受此默认影响。
      POSTGRES_DB: ${POSTGRES_DB:-csctalon_dev}
    # 固定容器用户为 postgres(uid 999): 官方镜像默认即 999, 显式声明使 bind mount 数据目录
    # 属主清晰可辨(宿主侧显示 999 而非错位的 dnsmasq), 便于 backup.sh/巡检直接遍历。
    # install-server.sh 已把 ${DB_DATA_DIR:-./data/postgres} 建好并 chown 999:999。
    user: "999:999"
    volumes:
      - ${DB_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机可连，不对局域网暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csctalon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: csctalon-redis
    # requirepass 从环境变量取(空则无密码, 仅 dev 直连场景); maxmemory 防止 Redis 无限增长拖垮宿主
    # 生产由 backend config fail-fast 强制 REDIS_PASSWORD 非空, 这里随之生效
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"; else redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru; fi"]
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机可连
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: csctalon-backend
    # 覆盖镜像 CMD（与 backend/Dockerfile、Dockerfile.patch 三处一致，#212 已消除 -w 4 矛盾）:
    # -w 1: 单 worker。下列进程内状态依赖单进程——llm_scheduler 的 threading.Condition 门闸
    #   （任一时刻仅 1 个 LLM 调用，多 worker 会并发打爆单个 ollama 端点）、SyncTaskManager
    #   同步互斥（多 worker 重复提交→数据重复）、登录限速进程内计数（限速失效）。
    #   多机/多 worker 扩容须先把这些状态迁至 Redis（v0.7 明确「立此存照、不做」）。
    # --timeout 900s: sync-all多源抓取含65s间隔,全程5-8分钟,默认120s会被gunicorn判超时SIGABRT→前端502
    command: ["gunicorn", "app.main:app", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000", "--timeout", "900", "--log-level", "info"]
    env_file:
      - ${ENV_FILE:-.env}
    # ★ 2026-09-22: 运行模式改由 APP_MODE 驱动（见 docs/arch/A-20260922-001）。
    #
    #   为什么不再硬编码 `ENV=prod`：
    #     ① `ENV` 是 docker-compose 的**保留变量**，无法从 .env 传入，
    #        只能在 compose 里写死 → 导致"本地也想跑 dev 却做不到"
    #        （本地 colima 栈被迫长期以 prod 模式运行）。
    #     ② `APP_MODE` 不冲突，可走 env_file → 本地可用
    #        docker-compose.override.yml 覆盖为 dev（该文件 gitignore 且生产没有）。
    #
    #   兼容性：settings 优先读 APP_MODE，回退读 ENV（见 app/core/config/settings.py）。
    #   生产 .env 里已有 `APP_MODE=prod`（见 deploy/env.production.example），
    #   故此处不再硬编码也不影响生产。
    #
    #   ⚠️ 若 .env 里既无 APP_MODE 也无 ENV，settings 默认 dev → 会因
    #      "dev 模式要求库名以 _dev 结尾"而拒绝启动（默认值安全侧设计）。
    #      生产必须在 .env 显式声明 APP_MODE=prod —— 这是**有意**的 fail-fast。
    environment:
      # ⚠️ 2026-09-06 修复(UPLOAD_DIR 容器内外路径错位):
      #    .env 的 UPLOAD_DIR/BROWSER_STATE_DIR 是**宿主机挂载源路径**(如 /opt/csctalon/uploads),
      #    经 env_file 注入容器后, 后端 settings 会把它当成**容器内写入路径** → 采集文件/登录态
      #    写进容器内非挂载目录(/opt/csctalon/uploads), 宿主看不到、容器重建即丢。
      #    这里用 environment 显式覆盖为**容器内挂载点路径**(/app/uploads 等), 保证进程内读写落
      #    在 bind mount 上(对应宿主机固定目录), 与上方 volumes 挂载一一对应。
      - UPLOAD_DIR=/app/uploads
      - BROWSER_STATE_DIR=/app/data/browser_states
    volumes:
      # 挂载变量与后端代码读取的 settings.UPLOAD_DIR / BROWSER_STATE_DIR 保持同名(单数),
      # 避免 UPLOADS_DIR/BROWSER_STATES_DIR 复数写法与代码不一致、.env 配串导致路径错配(2026-08-30 部署审计)
      - ${UPLOAD_DIR:-./backend/uploads}:/app/uploads
      - ${BROWSER_STATE_DIR:-./data/browser_states}:/app/data/browser_states   # Playwright 登录态(独立于 uploads, 不被静态挂载暴露)
      - ${BACKEND_LOGS_DIR:-./logs/backend}:/app/logs   # 持久化日志文件,避免容器重建丢失 500 堆栈
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机可连；前端经 nginx 反代访问
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # 预留迁移/种子/调度器启动时间
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      # 前端构建模式: debug=全量菜单(内测) / release=收敛菜单(生产默认)
      # 本地/内测: 在 .env 设 WEB_BUILD_MODE=debug 后 docker compose up -d --build 即全量菜单
      # 生产部署: 不设置则默认 release, 只显示核心菜单(运营看板/工作台/我的待办/专项分析3项/系统管理)
      args:
        BUILD_MODE: ${WEB_BUILD_MODE:-release}
        # ★ 2026-09-22: 环境模式传给前端（VITE_APP_MODE），与 BUILD_MODE 正交。
        #   缺省 prod（安全侧）；本地可在 override 里设为 dev。
        APP_MODE: ${APP_MODE:-prod}
    container_name: csctalon-web
    volumes:
      - ${NGINX_LOGS_DIR:-./logs/nginx}:/var/log/nginx
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 挂载配置,容器重启不丢失,本地改完 nginx -s reload 即生效
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro             # SSL 证书(HTTPS, 阿里云免费证书 nginx 格式上传到此)
    ports:
      - "80:80"
      - "443:443"                                             # HTTPS
    depends_on:
      backend:
        condition: service_healthy   # 等后端就绪再启动 nginx,消除 host not found in upstream emerg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
