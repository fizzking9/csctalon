# =============================================================================
# 1Panel OpenResty 兜底配置 — 拦截"未匹配域名"的请求, 不暴露 frp/frps
#
# 用途: 直接输 IP(如 http://42.193.247.117/)或访问未知 Host 时, 不再让 frps
#       返回它的默认提示页(暴露 frp 组件信息), 而是由 OpenResty 直接返回
#       自定义错误 / 断开连接。
#
# 原理: 这个 server 块标记为 default_server(优先级最低), 只有 Host 匹配不到
#       www.kimirock.top 等已配置站点时才会落到它。正常域名访问不受影响。
#
# 放置位置(二选一):
#   1. 1Panel → OpenResty 设置 → 配置修改 → 自定义配置文件(http 块内追加)
#   2. 1Panel → 网站 → 默认站点(把默认站点指到你自建的空白站点)
#   注意: 不要在 1Panel 界面直接改它管理的站点配置, 会被覆盖; 用"自定义配置"入口。
#
# 两种返回方式任选其一(二选一, 别同时用):
#   A) return 444   : 直接断开连接, 客户端看到"连接被重置", 完全看不出是什么服务(最干净)
#   B) return 403   : 返回可见的自定义错误页(可改文案), 不泄露任何服务信息
# =============================================================================

server {
    # 未匹配 Host 的 HTTP 请求(如直接输 IP)
    listen 80 default_server;
    server_name _;

    # ---------- 方式 A(推荐): 直接断开连接 ----------
    location / {
        return 444;
    }

    # ---------- 方式 B(可选): 自定义 403 错误页 ----------
    # 想用可见错误页时, 把上面的 location 换成下面这段:
    # location / {
    #     default_type text/html;
    #     return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>403</title></head><body style="text-align:center;font-family:sans-serif;padding-top:80px"><h1>403 Forbidden</h1><p>访问被拒绝</p></body></html>';
    # }
}

# -----------------------------------------------------------------------------
