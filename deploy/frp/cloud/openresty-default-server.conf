#     server_name _;
#     ssl_certificate     /www/server/openresty/conf/1panel_self.crt;
#     ssl_certificate_key /www/server/openresty/conf/1panel_self.key;
#
#     location / {
#         return 444;
#     }
# }

# =============================================================================
# 配套加固(强烈建议, 云端执行):
#   1. 封掉 frps vhostHTTPPort 的公网直连(防 frps 兜底被公网探到):
#        ufw deny 8080
#   2. 收紧 7000 到办公/内网出口 IP:
#        ufw allow from <你的公网出口IP> to any port 7000 proto tcp
#        ufw delete allow 7000/tcp   # 删掉之前的全开放规则(如果有)
# =============================================================================
