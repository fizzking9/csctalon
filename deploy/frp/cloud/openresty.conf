# =============================================================================
# 1Panel OpenResty 反向代理配置模板 — csctalon frp 外网入口
# 由 deploy/frp/cloud/deploy-frps.sh(--mode openresty, 默认)从占位符生成并打印,
# 用户把打印内容粘贴到 1Panel → 网站 → 反向代理 的"配置文件"中替换默认内容。
#
# 流量路径: 外网用户 → 域名:443 (1Panel OpenResty, TLS 由 1Panel 自动签发/续期)
#         → 127.0.0.1:8080 (frps vhostHTTPPort, 仅绑本机)
#         → frp 隧道 → 内网 frpc → 127.0.0.1:80 (本地 nginx web 容器)
#
# ⚠️ 说明:
#   1. 本文件是模板, 供脚本 sed 生成后打印; 实际粘贴到 1Panel 的是脚本打印的内容。
#   2. 占位符: REPLACE_FRP_DOMAIN=对外域名, 127.0.0.1:8080=frps vhostHTTPPort。
#   3. 证书/443 监听由 1Panel 的 OpenResty 自动管理(网站→SSL 申请 Let's Encrypt),
#      因此这里**不含** ssl_certificate / listen 443, 只写反代 location 逻辑。
#   4. 1Panel 反向代理默认自带 / 的 proxy_pass 指向上游; 若界面已配置上游
#      (127.0.0.1:8080), 可只保留下面"HTTP→HTTPS 跳转 + 关键头"部分, 删除重复的 location /。
# =============================================================================

# HTTP → HTTPS 301 跳转(1Panel 通常在网站配置里已处理; 若重复可删除本段)
server {
    listen 80;
    server_name REPLACE_FRP_DOMAIN;
    return 301 https://$host$request_uri;
}

# HTTPS 由 1Panel OpenResty 生成(证书自动签发), 这里只放反代配置
# 若 1Panel 界面已生成 https server 块, 把下方内容合并进该 server 块即可。
server {
    # listen 443 ssl;   ← 由 1Panel 管理, 不要手动写(否则证书路径/续期会冲突)
    server_name REPLACE_FRP_DOMAIN;

    # sync-all 同步多源(含 65s 间隔)可达 5-8 分钟, 需高于同步耗时, 否则 504
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端可能据此判断请求协议(HTTP/HTTPS), 必须传递
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
