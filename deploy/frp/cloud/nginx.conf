# =============================================================================
# 云端 nginx 配置模板 — 域名 HTTPS 终止 TLS → 反代后端
# 由 deploy/frp/cloud/deploy-frps.sh 从占位符生成后落盘到 /etc/nginx/conf.d/csctalon-frp.conf
# 证书格式: nginx 格式 .crt / .key, 上传到 /etc/nginx/certs/ 下
# 流量路径（2026-10-21 起）: 外网用户 → 域名:443 (云端 nginx TLS) → REPLACE_UPSTREAM (ZeroTier 直连)
# 历史路径（已停用）: → 127.0.0.1:8080 (frps vhostHTTPPort) → frp 隧道 → 内网 frpc → :80
# =============================================================================

# HTTP → HTTPS 301 跳转
server {
    listen 80;
    server_name REPLACE_FRP_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name REPLACE_FRP_DOMAIN;

    ssl_certificate     /etc/nginx/certs/REPLACE_FRP_CERT_NAME.crt;
    ssl_certificate_key /etc/nginx/certs/REPLACE_FRP_CERT_NAME.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 可选: IP 白名单(与内网 nginx 纵深防御一致)。安全组已收敛时可省略。
    # allow 203.0.113.0/24;
    # deny all;

    # sync-all 同步多源(含 65s 间隔)可达 5-8 分钟, 需高于同步耗时, 否则 504
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 200m;

    location / {
        # 2026-10-21: 改走 ZeroTier 直连(生产已停用 frpc/frps), 回滚时改回 http://127.0.0.1:8080
        proxy_pass http://REPLACE_UPSTREAM;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ★ 2026-09-24: 覆写客户端 IP(防伪造); 原为 $proxy_add_x_forwarded_for(追加, 可被客户端塞假 IP)
        proxy_set_header X-Forwarded-For $remote_addr;
        # 供内层 nginx 净化取值的自定义头(frp 不改写, 客户端无法伪造)
        proxy_set_header X-Real-Client-IP $remote_addr;
        # 后端可能据此判断请求协议, 必须传递
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
