[project]
name = "csctalon-backend"
version = "0.1.0"
description = "客服中心管理系统 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    # Excel/xlsx 原生读取(pandas 引擎, 对齐 Dockerfile; data_parser 依赖)
    "python-calamine>=0.2.0",
    # 浏览器自动化采集(对齐 Dockerfile; 运行时懒加载, 测试不需要浏览器二进制)
    "playwright>=1.45.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
    "pypinyin>=0.50.0",
    "httpx>=0.27.0",
    # 验证码自动识别(纯 Python,基于 ONNX,无额外系统依赖)
    # ddddocr 1.x 对常见 4-6 位数字/字母混合验证码识别率>95%
    "ddddocr>=1.4.11",
    "onnxruntime>=1.17.0",
    # 发票二维码图本地解码(规划设计 §4.5 全电发票识别链路)
    # pyzbar 依赖系统库 libzbar0(Dockerfile apt install libzbar0; mac brew install zbar)
    "pyzbar>=0.1.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # ⚠️ 2026-09-07: 锁定 ruff 主版本, 防 CI/本地版本漂移导致 I001 排序反复不一致
    #    (CI 每次装最新, 本地可能旧版, 同一 import 块两边判定相反)。
    #    0.16.x 与 CI 当前一致, tests/ 全规则已验证通过。
    "ruff>=0.16,<0.17",
]

# 显式包发现: backend/ 下有 app/data/uploads/alembic 多目录, flat-layout 会因
# "Multiple top-level packages" 拒绝 editable install(CI 失败根因)。只发布 app 包。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# 历史 lint 债基线(2026-09-01 统计, 见 docs/standards/):
# app/ 有 1996 项 E501(行太长, 跨 154 文件), 属风格债不影响正确性。
# 全局豁免 E501, 其余 E/F/I/W 规则仍对新增代码生效(CI 已强制 tests/ 全规则)。
# 待专项治理: 逐步收紧 E501 或按文件拆分长行。
#
# 2026-09-02 补充豁免(有意/合理的风格模式, 不冒险大改核心文件):
# - E701/E702(单行多语句 116 项): analytics.py 占 104 项, 多为 `if x: return` 压缩写法, 机械拆分核心文件风险高
# - E402(模块级 import 非顶部 53 项): 结构性原因(如 main.py 需先配置 logging.Formatter.converter 再 import, data_source_registry 需先执行注册代码)
# - E722(bare except 2 项): 少数兜底捕获, 手动改为 except Exception 需逐一评估
# 以上均为风格债不影响正确性; 其余 E/F/I/W 规则仍对新增代码生效。
extend-ignore = ["E501", "E701", "E702", "E402", "E722"]
