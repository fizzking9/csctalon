[project]
name = "csctalon-backend"
version = "0.1.0"
description = "客服中心管理系统 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
    "pypinyin>=0.50.0",
    "httpx>=0.27.0",
    # 验证码自动识别(纯 Python,基于 ONNX,无额外系统依赖)
    # ddddocr 1.x 对常见 4-6 位数字/字母混合验证码识别率>95%
    "ddddocr>=1.4.11",
    "onnxruntime>=1.17.0",
    # 发票二维码图本地解码(规划设计 §4.5 全电发票识别链路)
    # pyzbar 依赖系统库 libzbar0(Dockerfile apt install libzbar0; mac brew install zbar)
    "pyzbar>=0.1.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
