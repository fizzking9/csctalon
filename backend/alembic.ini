# Alembic config
#
# !!! KEEP THIS FILE ASCII-ONLY !!!
#   Alembic reads this ini via configparser with encoding="locale"
#   (alembic/util/compat.py:read_config_parser). On a non-UTF-8 Windows locale
#   (e.g. cp936/GBK) a UTF-8 ini raises UnicodeDecodeError, which breaks BOTH
#   `alembic upgrade head` AND the app's startup migration
#   (app/main.py:_run_migrations_on_startup builds Config("alembic.ini")).
#   PYTHONUTF8/-X utf8 do NOT help: locale.getencoding() still returns cp936.
#   Non-ASCII comments must live in code/docs, not here.

[alembic]
script_location = alembic
# Placeholder: overwritten at runtime by alembic/env.py with settings.database_url;
# a real password must never be written here.
# (2026-08-20 audit OPS-10: a real password used to be hardcoded here and was
#  globally allowlisted in gitleaks.)
sqlalchemy.url = postgresql+psycopg2://csctalon:CHANGE_ME@db:5432/csctalon
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
