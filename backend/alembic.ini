# Alembic 配置

[alembic]
script_location = alembic
# 占位符: 运行时由 alembic/env.py 用 settings.database_url 覆盖, 此处禁止写真实口令
# (2026-08-20 审计 OPS-10: 原硬编码 csctalon123 入库且被 gitleaks 全局放行)
sqlalchemy.url = postgresql+psycopg2://csctalon:CHANGE_ME@db:5432/csctalon
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
