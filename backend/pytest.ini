# pytest 配置
# 说明: 测试默认连 PostgreSQL 测试库 csctalon_test(conftest.py 里通过环境变量注入),
#       不会触碰开发/生产库。如需覆盖, 设置环境变量 TEST_POSTGRES_DB 等。
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
