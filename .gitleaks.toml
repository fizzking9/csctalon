# gitleaks 凭证扫描配置
# 用途: 提交前/CI 扫描,防止手机号、密码、OpenAPI ClientId/Secret 等凭证再次硬编码入库
# 运行: gitleaks detect --source . --config .gitleaks.toml --redact
# 预提交钩子: 见 scripts/install-gitleaks-hook.sh

title = "csctalon 自定义凭证扫描"

[extend]
# 继承 gitleaks 内置规则(覆盖常见密钥格式: AKIA/openai/strip/jwt 等)
useDefault = true

# ---------- 全局白名单 ----------
[allowlist]
description = "允许的路径/示例值"
# 注意: 不再整体放行 docs/*.md —— 处置手册等文档必须被扫描,
# 防止把真实凭证当示例写进文档再次入库。文档中只允许出现占位符。
paths = [
    '''^\.env\.example$''',
    '''^backend/\.env\.example$''',
    '''^\.gitleaks\.toml$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
]
# 占位符/示例值不报警
regexes = [
    '''<请修改.*>''',
    '''<真实.*>''',
    '''REDACTED_''',
    '''CHANGE_ME_IN_PRODUCTION''',
    '''admin123''',  # 仅 .env.example/初始化默认值,首次启动强制改密
    '''csctalon123''',  # 同上,默认占位
]

# ---------- 自定义规则 ----------

# 规则1: SCRM 白音平台手机号(11位 1开头) + 密码成对出现
[[rules]]
id = "scrm-baiyin-credentials"
description = "SCRM 白音平台登录凭证(手机号+密码)"
regex = '''(?i)(SCRM_WEB_USERNAME|PW_USERNAME|web_username)\s*[:=]\s*["']?1\d{10}["']?'''
tags = ["scrm", "phone", "credential"]

[[rules]]
id = "scrm-openapi-client-secret"
description = "SCRM OpenAPI ClientId/ClientSecret(32位十六进制大写)"
regex = '''(?i)(SCRM_CLIENT_(ID|SECRET)|OPENAPI_CLIENT_(ID|SECRET))\s*[:=]\s*["']?[A-Za-z0-9]{30,}["']?'''
tags = ["scrm", "openapi", "credential"]

# 规则2: 看似真实的明文密码(含特殊符号的强密码模式,排除纯占位符)
[[rules]]
id = "hardcoded-strong-password"
description = "疑似硬编码强密码(字母+数字+特殊符号)"
regex = '''(?i)(password|passwd|pwd|secret)\s*[:=]\s*["'][^"']{8,}["']'''
# 排除明显占位
[rules.allowlist]
regexes = [
    '''<.*>''',
    '''CHANGE_ME''',
    '''example''',
    '''your[_-]?password''',
    '''请修改''',
]
tags = ["password", "hardcoded"]

# 规则3: 硬编码管理员手机号(11位连续数字,出现在赋值/字典字面量中)
[[rules]]
id = "hardcoded-phone-number"
description = "疑似硬编码手机号(11位 1开头)"
regex = '''["']?(1[3-9]\d{9})["']?\s*[,\)#]'''
tags = ["phone", "pii"]
