# gitleaks 凭证扫描配置
# 用途: 提交前/CI 扫描,防止手机号、密码、OpenAPI ClientId/Secret 等凭证再次硬编码入库
# 运行: gitleaks detect --source . --config .gitleaks.toml --redact
# 预提交钩子: 见 scripts/install-gitleaks-hook.sh

title = "csctalon 自定义凭证扫描"

[extend]
# 继承 gitleaks 内置规则(覆盖常见密钥格式: AKIA/openai/strip/jwt 等)
useDefault = true

# ---------- 全局白名单 ----------
[allowlist]
description = "允许的路径/示例值"
# 注意: 不再整体放行 docs/*.md —— 处置手册等文档必须被扫描,
# 防止把真实凭证当示例写进文档再次入库。文档中只允许出现占位符。
paths = [
    '''^\.env\.example$''',
    '''^backend/\.env\.example$''',
    '''^\.gitleaks\.toml$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
]
# 占位符/示例值不报警
# 注意: admin123/csctalon123 已从全局 allowlist 移除(2026-08-20 审计 OPS-11):
#   - .env.example 中的默认值已由上方 paths allowlist 覆盖;
#   - 业务代码/脚本里再出现这些弱口令必须被扫描报警, 不允许静默放行。
regexes = [
    '''<请修改.*>''',
    '''<真实.*>''',
    '''REDACTED_''',
    '''CHANGE_ME_IN_PRODUCTION''',
]

# ---------- 自定义规则 ----------

# 规则1: SCRM 白音平台手机号(11位 1开头) + 密码成对出现
[[rules]]
id = "scrm-baiyin-credentials"
description = "SCRM 白音平台登录凭证(手机号+密码)"
regex = '''(?i)(SCRM_WEB_USERNAME|PW_USERNAME|web_username)\s*[:=]\s*["']?1\d{10}["']?'''
tags = ["scrm", "phone", "credential"]

[[rules]]
id = "scrm-openapi-client-secret"
description = "SCRM OpenAPI ClientId/ClientSecret(32位十六进制大写)"
regex = '''(?i)(SCRM_CLIENT_(ID|SECRET)|OPENAPI_CLIENT_(ID|SECRET))\s*[:=]\s*["']?[A-Za-z0-9]{30,}["']?'''
tags = ["scrm", "openapi", "credential"]

# 规则2: 看似真实的明文密码(含特殊符号的强密码模式,排除纯占位符)
[[rules]]
id = "hardcoded-strong-password"
description = "疑似硬编码强密码(字母+数字+特殊符号)"
# 值首字符不为 < : 排除 <密码>/<ClientSecret> 等占位符(真实密码极少以 < 开头)
regex = '''(?i)(password|passwd|pwd|secret)\s*[:=]\s*["'][^"'<][^"']{7,}["']'''
# 排除明显占位
# 注意: 规则内 allowlist 覆盖全局 allowlist, REDACTED 须在此重复声明,
# 否则 filter-repo 替换后的历史占位(如 PW_PASSWORD="REDACTED_PASSWORD")会被误报
[rules.allowlist]
regexes = [
    '''<.*>''',
    '''CHANGE_ME''',
    '''example''',
    '''your[_-]?password''',
    '''请修改''',
    '''REDACTED''',
]
tags = ["password", "hardcoded"]

# 规则3: 硬编码管理员手机号(11位连续数字,出现在赋值/字典字面量中)
[[rules]]
id = "hardcoded-phone-number"
description = "疑似硬编码手机号(11位 1开头)"
regex = '''["']?(1[3-9]\d{9})["']?\s*[,\)#]'''
tags = ["phone", "pii"]

# 规则4: 杉猫(BMS)平台凭证(2026-08-20 审计 C-1 新增)
# 覆盖两种形态: SHANMAO_PASS = "值" 直接赋值, 与 os.environ.get("SHANMAO_PASS", "值") 回退默认值
# 值需非空、非占位符(<开头)、至少 2 字符, 避免误报 .env.example 的空值占位
[[rules]]
id = "shanmao-platform-credentials"
description = "杉猫平台账号密码(含 os.environ.get 回退默认值形态)"
regex = '''(?i)SHANMAO_(?:USER|PASS|PASSWORD|USERNAME)\s*[=:]\s*["'][^"'\s<][^"']*["']|SHANMAO_(?:USER|PASS|PASSWORD|USERNAME)["']\s*,\s*["'][^"'\s<][^"']*["']'''
tags = ["shanmao", "bms", "credential"]
