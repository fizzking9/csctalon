# GitHub Actions: PR 工单号门禁 (G1)
#
# 迁移自 .gitea/workflows/issue-gate.yml; 对应锁定设计
# docs/arch/A-20260903-001-issue-automation-gates.md §2.1。规则未变:
#   - PR 标题或描述必须包含 #<数字>(如 #2), 否则 CI fail
#   - 豁免: 变更文件全部为 docs/*.md 或根 *.md 的纯文档 PR
# 实现差异: Gitea REST → GitHub REST(gh CLI + 内置 GITHUB_TOKEN, 无需自建 secret)。

name: issue-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 关联工单号
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title="${PR_TITLE:-}"
          body="${PR_BODY:-}"
          num="${PR_NUMBER:-}"

          echo "== PR #${num} 标题/描述 =="
          printf '%s\n' "$title"
          printf '%s\n' "$body"

          # 1) 标题或描述含 #数字 即通过
          if printf '%s\n%s\n' "$title" "$body" | grep -Eq '#[0-9]+'; then
            echo "✅ 已关联工单号, 门禁通过"
            exit 0
          fi

          # 2) 未关联工单号 → 检查是否纯文档 PR(豁免)
          files=$(gh api "repos/${REPO}/pulls/${num}/files" --paginate --jq '.[].filename' || true)

          echo "== 变更文件 =="
          echo "$files"

          non_doc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*.md|*.md) ;;
              *) non_doc=1 ;;
            esac
          done <<< "$files"

          if [ "$non_doc" = "0" ]; then
            echo "✅ 纯文档 PR, 豁免工单号门禁"
            exit 0
          fi

          echo "❌ PR 未关联工单号(标题/描述需含 #<issue号>), 且包含代码变更"
          echo "   请在 PR 标题或描述中加入 #工单号, 例如: 修复 xxx #2"
          exit 1
