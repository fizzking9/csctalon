# 纯 HTTP 配置(2026-08-25 生产回退: 当前部署为内网/纯 IP 场景, 无域名证书)
# 如需启用 HTTPS, 按 deploy/README.md §10 落地(上传证书 + .env 配 CERTS_DIR +
# 将下方 80 server 替换为 301 跳转 + 443 ssl server 块)。

# ── 自定义访问日志格式(工单 #66, 2026-09-11) ──
# 背景: 排障 AI 助手"6 秒同步等待越线"时, 因官方 main 格式**不含 $request_time**,
#       只能进容器手工计时, 无法从日志直接统计慢请求分布。
# 做法: 在官方字段后**追加** $request_time / $upstream_response_time, 不改动前面字段顺序,
#       故既有基于 AWK 位置(如 $9=status, $10=body_bytes_sent)的分析脚本仍可用。
# 注意: 不能重定义已存在的 `main`, 否则 nginx 报 duplicate log_format; 用独立名字。
log_format  csctalon_main  '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time urt=$upstream_response_time';

# ── 真实客户端 IP 净化(2026-09-24 审计 IP 修复) ──
# 背景: 操作日志(operation_logs.ip)记的是 docker 网关 172.21.0.1 —— 链路是
#   公网 用户 → 云端 openresty → frps 隧道 → frpc → 本机 127.0.0.1:80
#   → docker 网关(172.21.0.1) → 本容器; 后端取 XFF 末段 = 网关, 审计无法按来源 IP 追溯。
# 做法(信任边界):
#   · 隧道流量: 本机看到的对端落在 docker 私有网段 → 取云端边缘**覆写**注入的
#     X-Real-Client-IP(客户端自带/伪造的 XFF 已被边缘丢弃, 不可伪造);
#     边缘未注入时记 "unknown" —— 明确标示链路未就绪, 好过静默记成网关误导排障。
#   · 局域网(192.168.10.0/24) / ZeroTier(10.147.17.0/24) 直连: 对端即真实客户端,
#     一律用对端地址并**忽略客户端自带的任何 X-Forwarded-For**(防伪造污染审计)。
map $http_x_real_client_ip $cs_edge_client_ip {
    default $http_x_real_client_ip;
    ""      "unknown";
}
map $remote_addr $cs_client_ip {
    default                             $remote_addr;
    "~^172[.](1[6-9]|2[0-9]|3[01])[.]"  $cs_edge_client_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 使用自定义格式(便于按 rt= 统计慢请求)
    access_log /var/log/nginx/access.log csctalon_main;

    # favicon: 前端无独立 favicon, 直接 204 静默(suppress 404 噪音)
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # ---------- 安全响应头 ----------
    # CSP: 限制资源加载源。script/style 允许 unsafe-inline(vite modulepreload polyfill +
    #       Element Plus 内联样式需要); 其余资源严格限本源, 阻断外联数据外带与点击劫持。
    #       XSS 防护已由后端 DOMPurify/escapeHtml + 前端校验分层覆盖。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # X-XSS-Protection 已废弃且可被滥用, 置 0 交由 CSP 处理
    add_header X-XSS-Protection "0" always;
    # index.html / SPA 回退页不缓存(每次重新校验), 避免前端构建后浏览器引用已被删除的旧 chunk 导致菜单点击 404
    # 带 hash 的静态资源不受影响: 下方静态资源 location 自带 add_header, 仍按 immutable 30d 缓存
    add_header Cache-Control "no-cache" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 拦截废弃的 /api/v1/history 接口(经查为 Zabbix 监控服务器 webhook 误配到此,csctalon 无此路由)
    # 直接返回 204,不转发后端、不记入 access log,避免海量 404 日志与请求体缓冲警告
    location = /api/v1/history {
        access_log off;
        return 204;
    }

    # 拦截公网扫描器的常见探测路径, 不落 SPA 回退。
    # 背景(2026-09-24 审计): .env/.git/wp-admin/xmlrpc.php/phpinfo 等 6000+ 次探测
    # 因落到 `location /` 的 try_files 全部返回 200 index.html(741B) —— 虽无文件泄露,
    # 但污染 access.log 并给扫描器"路径存在"的假信号。本系统不存在这些路径, 直接 404。
    # 注: 不匹配 /api/ 与静态资源路径(见下方各 location); ^~ 与 = location 仍优先。
    location ~* (^|/)\.(env|git|svn|hg|aws|ssh|vscode|idea|DS_Store|htaccess|htpasswd|user\.ini|project|wslconfig)|/wp-(admin|login|content|includes|json)|xmlrpc\.php|phpmyadmin|phpinfo|/vendor/|/actuator|/_vti_|/storage/logs/|laravel\.log|user_secrets|/(cgi-bin|boaform)/|\.(php|asp|aspx|jsp|cgi|sql|bak|old|orig|save|swp|swo|backup)$ {
        access_log off;
        return 404;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 真实客户端 IP 由上方 map 净化后**覆写**(单值, 不可被客户端伪造);
        # 后端取 XFF 末段即该值(见 app/middleware/operation_log.py 与 api/v1/auth.py)
        proxy_set_header X-Real-IP $cs_client_ip;
        proxy_set_header X-Forwarded-For $cs_client_ip;
        # sync-all 同步多源(含 65s 间隔)可达 5-8 分钟,需高于同步耗时,否则 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 200m;
        # 大数据响应(refund-recovery 等聚合接口)不落盘: 放大 proxy buffer
        # (2026-08-30 审计: "upstream response is buffered to a temporary file" 集中在这些接口)
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        # 上传 Excel 请求体缓冲到内存, 减少 "request body buffered to temp file" 告警
        client_body_buffer_size 2m;
    }

    # 审计贴图等附件静态资源(经后端 SafeStaticFiles 受控放行,仅图片)
    # ^~ 前缀跳过下方正则 location 检查(2026-08-20 审计 OPS-01/H-6 修复):
    #   原普通前缀会被 `~* \.(png|jpg|...)$` 正则遮蔽, 导致 /uploads/*.png 命中静态缓存
    #   location 而从 /usr/share/nginx/html 找文件 → 生产贴图 404。
    # 不加此项时 /uploads/... 会落到 SPA fallback 返回 index.html,生产贴图打不开
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cs_client_ip;
        proxy_set_header X-Forwarded-For $cs_client_ip;
        client_max_body_size 20m;
    }

    # 静态资源缓存(此 location 有自己的 add_header, 需重复安全头否则继承失效)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-XSS-Protection "0" always;
    }
}
