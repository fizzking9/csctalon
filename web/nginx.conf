server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- 安全响应头 ----------
    # CSP: 限制资源加载源。script/style 允许 unsafe-inline(vite modulepreload polyfill +
    #       Element Plus 内联样式需要); 其余资源严格限本源, 阻断外联数据外带与点击劫持。
    #       XSS 防护已由后端 DOMPurify/escapeHtml + 前端校验分层覆盖。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # X-XSS-Protection 已废弃且可被滥用, 置 0 交由 CSP 处理
    add_header X-XSS-Protection "0" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 拦截废弃的 /api/v1/history 接口(经查为 Zabbix 监控服务器 webhook 误配到此,csctalon 无此路由)
    # 直接返回 204,不转发后端、不记入 access log,避免海量 404 日志与请求体缓冲警告
    location = /api/v1/history {
        access_log off;
        return 204;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sync-all 同步多源(含 65s 间隔)可达 5-8 分钟,需高于同步耗时,否则 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 200m;
    }

    # 审计贴图等附件静态资源(经后端 SafeStaticFiles 受控放行,仅图片)
    # 不加此项时 /uploads/... 会落到 SPA fallback 返回 index.html,生产贴图打不开
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    # 静态资源缓存(此 location 有自己的 add_header, 需重复安全头否则继承失效)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-XSS-Protection "0" always;
    }
}
