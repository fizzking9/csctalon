# 纯 HTTP 配置(2026-08-25 生产回退: 当前部署为内网/纯 IP 场景, 无域名证书)
# 如需启用 HTTPS, 按 deploy/README.md §10 落地(上传证书 + .env 配 CERTS_DIR +
# 将下方 80 server 替换为 301 跳转 + 443 ssl server 块)。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # favicon: 前端无独立 favicon, 直接 204 静默(suppress 404 噪音)
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # ---------- 安全响应头 ----------
    # CSP: 限制资源加载源。script/style 允许 unsafe-inline(vite modulepreload polyfill +
    #       Element Plus 内联样式需要); 其余资源严格限本源, 阻断外联数据外带与点击劫持。
    #       XSS 防护已由后端 DOMPurify/escapeHtml + 前端校验分层覆盖。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # X-XSS-Protection 已废弃且可被滥用, 置 0 交由 CSP 处理
    add_header X-XSS-Protection "0" always;
    # index.html / SPA 回退页不缓存(每次重新校验), 避免前端构建后浏览器引用已被删除的旧 chunk 导致菜单点击 404
    # 带 hash 的静态资源不受影响: 下方静态资源 location 自带 add_header, 仍按 immutable 30d 缓存
    add_header Cache-Control "no-cache" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 拦截废弃的 /api/v1/history 接口(经查为 Zabbix 监控服务器 webhook 误配到此,csctalon 无此路由)
    # 直接返回 204,不转发后端、不记入 access log,避免海量 404 日志与请求体缓冲警告
    location = /api/v1/history {
        access_log off;
        return 204;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sync-all 同步多源(含 65s 间隔)可达 5-8 分钟,需高于同步耗时,否则 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 200m;
        # 大数据响应(refund-recovery 等聚合接口)不落盘: 放大 proxy buffer
        # (2026-08-30 审计: "upstream response is buffered to a temporary file" 集中在这些接口)
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        # 上传 Excel 请求体缓冲到内存, 减少 "request body buffered to temp file" 告警
        client_body_buffer_size 2m;
    }

    # 审计贴图等附件静态资源(经后端 SafeStaticFiles 受控放行,仅图片)
    # ^~ 前缀跳过下方正则 location 检查(2026-08-20 审计 OPS-01/H-6 修复):
    #   原普通前缀会被 `~* \.(png|jpg|...)$` 正则遮蔽, 导致 /uploads/*.png 命中静态缓存
    #   location 而从 /usr/share/nginx/html 找文件 → 生产贴图 404。
    # 不加此项时 /uploads/... 会落到 SPA fallback 返回 index.html,生产贴图打不开
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    # 静态资源缓存(此 location 有自己的 add_header, 需重复安全头否则继承失效)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-XSS-Protection "0" always;
    }
}
