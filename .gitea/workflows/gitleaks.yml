# Gitea Actions: gitleaks 凭证扫描(纯 Docker 方案)
#
# ⚠️ 2026-09-02 改造: 本仓库 runner 运行在群晖内网(无法访问 github.com),
#    原 `uses: actions/checkout@v4` / `gitleaks/gitleaks-action@v2` 无法下载,
#    job 卡死在 "Set up job"。改为纯 `docker run` 本地执行:
#    - checkout: runner(:host 模式)已自动 clone 代码到工作目录, 无需 action
#    - gitleaks: 用本地 zricethezav/gitleaks 镜像扫描
#
# 本地已有 pre-commit 钩子(仅扫暂存区), 本 CI 作为最后一道防线扫描全量历史。

name: gitleaks

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (显式 clone)
        # 仓库公开, 无需凭据。clone 到 /workspace(宿主机共享目录, runner 容器内视角),
        # 这样 docker run(daemon=宿主机) 能挂载到同一份代码。
        # 宿主机绝对路径 = /vol2/@appcenter/gitea-runner/workspace/ci-repo
        run: |
          rm -rf /workspace/ci-repo
          git clone --quiet http://127.0.0.1:3000/tanzk/csctalon.git /workspace/ci-repo
          cd /workspace/ci-repo && git log --oneline -1
          ls .gitleaks.toml

      - name: gitleaks scan (docker)
        run: |
          # docker run 挂载的是宿主机视角路径(daemon 解析), 必须用宿主机绝对路径
          docker run --rm \
            -v /vol2/@appcenter/gitea-runner/workspace/ci-repo:/repo -w /repo \
            zricethezav/gitleaks:latest \
            detect --source . --config .gitleaks.toml --redact --no-banner
